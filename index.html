<!DOCTYPE html>

<style>
:root{
  --ink:#0B2545;
  --paper:#F2F5F9;
  --card:#FFFFFF;
  --line:#DCE3EC;
  --text:#14213D;
  --muted:#5B6B82;
  --azure:#1E88D2;
  --azure-d:#1670AD;
  --danger:#C0342D;
  --ok:#1B8A5F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #7CC0F0;outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;text-decoration:none;line-height:1.3}
.btn:hover{border-color:#B7C4D6}
.btn.primary{background:var(--azure);border-color:var(--azure);color:#fff}
.btn.primary:hover{background:var(--azure-d);border-color:var(--azure-d)}
.btn.danger{color:var(--danger);border-color:#EFC4C1}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.32);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:11px 14px}
.link{border:0;background:none;padding:0;color:var(--azure-d);cursor:pointer;font-size:13px;text-decoration:underline}

/* ---------- Header ---------- */
.top{background:var(--ink);color:#fff;border-bottom:4px solid var(--azure)}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:9px;background:var(--azure);display:grid;place-items:center;font-weight:800;font-size:21px}
.brand-name{font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:700;font-size:13px}
.tagline{display:flex;flex-wrap:wrap;gap:0 .5em;padding:20px 0 38px;font-weight:800;font-size:clamp(26px,5.4vw,54px);line-height:1.12;letter-spacing:-.02em}
.tagline.compact{padding:6px 0 0;font-size:clamp(22px,4vw,34px)}

/* ---------- Portal ---------- */
main.wrap{padding-bottom:56px}
.hello{margin:22px 0 4px;color:var(--muted)}
.hello strong{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0 6px}
.search{position:relative;flex:1 1 260px;max-width:440px}
.search input{width:100%;padding:10px 12px 10px 40px;border:1px solid var(--line);border-radius:9px;background:#fff}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;margin-left:auto}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;display:flex;gap:7px;align-items:center;font-weight:500}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:#B7C4D6}
.chip[aria-pressed=true]{background:var(--azure);border-color:var(--azure);color:#fff}
.viewas{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px;padding:10px 14px;background:#FFF6D6;border:1px solid #EBD27A;border-radius:10px}

.group{margin-top:26px}
.group-title{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;margin-bottom:10px}
.group-title .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.group-title .count{font-weight:600;font-size:12.5px;color:var(--c);background:var(--t);border-radius:999px;padding:1px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 13px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:11px;text-decoration:none;min-height:88px}
.tile:hover{border-color:var(--c);box-shadow:0 1px 0 var(--c)}
.tile .ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--t);display:grid;place-items:center;font-size:22px}
.tile .tx{display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:26px}
.tile .nm{font-weight:600;line-height:1.3}
.tile .ds{color:var(--muted);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .no{position:absolute;top:9px;right:11px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:18px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--azure);color:#fff;text-align:left;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr:hover{background:#F7FAFD}
td.num,th.num{width:56px;text-align:center;font-variant-numeric:tabular-nums}
.nmcell{display:flex;align-items:center;gap:10px;font-weight:600}
.nmcell .e{font-size:19px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--t);color:var(--c);font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.gray{background:#EAEFF5;color:var(--muted)}
.badge.ok{background:#DDF3E8;color:var(--ok)}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{margin-top:28px;padding:36px 20px;text-align:center;background:#fff;border:1px dashed #B7C4D6;border-radius:12px;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.foot{margin-top:40px;color:var(--muted);font-size:13px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{background:var(--ink);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:48px;border-right:4px solid var(--azure)}
.login-brand .tagline{padding:0;font-size:clamp(32px,4.6vw,58px)}
.login-note{max-width:38ch;opacity:.75}
.login-form-wrap{display:grid;place-items:center;padding:28px}
.login-card{width:100%;max-width:380px}
.login-card h1{font-size:26px;font-weight:800;margin-bottom:18px}
.form-err{min-height:22px;color:var(--danger);font-size:13.5px;margin-bottom:6px}
.demo{margin-top:26px;padding:14px;border:1px dashed #B7C4D6;border-radius:10px;background:#fff}
.demo p{font-size:13px;color:var(--muted);margin-bottom:8px}
.demo .chips{gap:6px}

/* ---------- Admin ---------- */
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.admin-head h1{font-size:24px;font-weight:800}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 16px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--azure)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.trunc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:4px}
.panel p{color:var(--muted);margin-bottom:12px}
.panel .btns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Forms & dialogs ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:13.5px}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid #C6D0DD;border-radius:8px;background:#fff;width:100%}
.field textarea{resize:vertical;min-height:64px}
.hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row3{display:grid;gap:12px;grid-template-columns:84px 84px 1fr}

dialog{border:0;border-radius:14px;padding:0;width:min(660px,calc(100vw - 20px));max-height:calc(100vh - 20px);color:var(--text);box-shadow:0 20px 60px rgba(11,37,69,.35)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(11,37,69,.55)}
.dlg{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 20px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.dlg-head .x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.dlg-body{padding:18px 20px 6px;overflow:auto;min-height:0}
.dlg-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line)}
.dlg-err{flex:1;color:var(--danger);font-size:13.5px}
.perm{border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:280px;overflow:auto}
.perm-group{margin-bottom:10px}
.perm-group h4{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-bottom:2px}
.perm label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;font-weight:400;cursor:pointer}
.perm input[type=checkbox]{width:auto;flex:none;margin:0;padding:0}
.perm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.perm-top strong{font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast.show{opacity:1}

@media(max-width:820px){
  .login{grid-template-columns:1fr}
  .login-brand{border-right:0;border-bottom:4px solid var(--azure);gap:32px}
}
@media(max-width:560px){
  .uname{display:none}
  .btn.ghost span.lbl{display:none}
  .seg{margin-left:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- v2: chức danh, ma trận quyền, người dùng hàng loạt ---------- */
.badge.danger{background:#FBE3E1;color:var(--danger)}
.badge.warn{background:#FFF1CC;color:#8A5B00}
.badge.info{background:#DFEEFB;color:var(--azure-d)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.ufilters{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 320px}
.ufilters input,.ufilters select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.ufilters input{flex:1 1 220px;max-width:340px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;padding:9px 12px;background:#E8F3FC;border:1px solid #B9D9F2;border-radius:10px}
.sel-bar strong{margin-right:6px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.pager .btns{gap:4px}
td.chk,th.chk{width:40px;text-align:center}
td.chk input,th.chk input{width:17px;height:17px;cursor:pointer}
.tbl-wrap.matrix{max-height:70vh;overflow:auto}
.matrix table{min-width:0;width:auto}
.matrix th{position:sticky;top:0;z-index:2;text-align:center;vertical-align:bottom;min-width:88px;max-width:112px;font-size:13px;white-space:normal;line-height:1.3}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;text-align:left;min-width:250px;z-index:1;background:#fff}
.matrix th:first-child{background:var(--azure);z-index:3}
.matrix tbody tr:hover td:first-child{background:#F7FAFD}
.matrix td{text-align:center}
.matrix td.cellchk{padding:6px}
.matrix input[type=checkbox]{width:19px;height:19px;cursor:pointer}
.matrix th .link{color:#fff;font-size:12px;display:block;margin:4px auto 0}
.matrix .catline{font-size:12px;color:var(--muted);font-weight:400}
.exc{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.exc.add{color:var(--ok)}
.exc.blk{color:var(--danger)}
.perm label{width:100%}
.imp-sum{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.imp-list{margin:6px 0 0;padding-left:18px;font-size:13.5px;max-height:170px;overflow:auto}
.imp-list li{margin-bottom:2px}
.imp-box{border:1px dashed #B7C4D6;border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#FAFCFE}
.check{display:flex;gap:8px;align-items:center;font-weight:400!important}
.check input{width:auto!important}
@media(max-width:560px){.matrix th:first-child,.matrix td:first-child{min-width:170px}}
</style>
</head>

<script>
(function(){
'use strict';

/* =====================================================================
   CẤU HÌNH
   - Có SUPABASE_URL + SUPABASE_KEY: chạy thật, đăng nhập và dữ liệu nằm trên Supabase
     (cần chạy file supabase_setup.sql một lần trong SQL Editor của Supabase).
   - Để trống SUPABASE_URL: chạy chế độ dùng thử, dữ liệu lưu trong trình duyệt.
   - SUPABASE_KEY là khóa "publishable" (được phép để trong trang web). KHÔNG dán khóa "secret" vào đây.
   ===================================================================== */
const CFG = window.ONEMSG_CONFIG || {};
const SUPABASE_URL = ('url' in CFG) ? CFG.url : 'https://jkkfvvcdlpnarxvvblzq.supabase.co';
const SUPABASE_KEY = ('key' in CFG) ? CFG.key : 'sb_publishable_gC6Qb_K9SmwM4S_kj86Dwg_BApkiOQL';
const SERVER = !!(SUPABASE_URL && SUPABASE_KEY);
const DEMO_MODE = !SERVER;
const TOKEN_KEY = 'onemsg_dktk_token';
const DEFAULT_APP_NAME = 'ONE MSG DKTK';
const DEFAULT_TAGLINE  = 'One access. One view. One success';

const STORE_KEY   = 'onemsg_dktk_v3';

/* =====================================================================
   LỚP DỮ LIỆU (bản demo: localStorage)
   ===================================================================== */
const mem = {};
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return (k in mem) ? mem[k] : null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }

// Băm mật khẩu kiểu đơn giản, CHỈ dùng cho bản demo (không an toàn cho bản chạy thật).
function hashPw(pw){
  const str = 'onemsg|' + pw;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function uid(){ return 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

// Danh mục lấy theo "Bảng tổng hợp chấm công" của bệnh viện (cột Chức danh và Phòng ban).

const DEFAULT_DEPTS = [
  "Ban Giám đốc",

function seed(){
  const titles = DEFAULT_TITLES.map((n, i) => ({ id: 'c' + (i + 1), name: n }));
  const idsOf = fn => titles.filter(c => fn(c.name)).map(c => c.id);
  const union = (...a) => [...new Set(a.flat())];
  const ALL  = titles.map(c => c.id);

  inactive: 'Tài khoản đã bị khóa. Liên hệ quản trị viên.'
};
async function rpc(fn, args){
  let res;
  try {
    res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify(args || {})
    });
  } catch(e){ throw new Error('NETWORK'); }
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + res.status));
  return data;
}
async function call(fn, args){
  try { return await rpc(fn, args); }
  catch(e){
    if (e.message === 'SESSION') sessionLost();
    else if (e.message === 'NETWORK') toast('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
    else if (e.message === 'FORBIDDEN') toast('Bạn không có quyền thực hiện thao tác này.');
    else toast('Lỗi máy chủ: ' + e.message);
    throw e;
  }
}
function sessionLost(msg){
  document.querySelectorAll('dialog[open]').forEach(d => d.close());
  ui.token = null; ui.me = null; ui.myTools = []; ui.pendingId = null; ui.viewAs = null; ui.page = 'portal';
  lsDel(TOKEN_KEY);
  renderLogin(msg || 'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.', '');
}

}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
}
function key(s){ return norm(s).replace(/[^a-z0-9]/g,''); }
function normUrl(u){
  u = (u || '').trim();
  if (!u) return '';
  if (/^(javascript|data|vbscript):/i.test(u)) return '';
  if (/^(https?:\/\/|\/|\.\/|mailto:)/i.test(u)) return u;
  return 'https://' + u;
}
function hasLink(u){ return !!u && u !== '#'; }
function hostOf(u){ try { return new URL(u).host; } catch(e){ return u; } }
function initials(name){
  const p = String(name || '?').replace(/\(.*?\)/g,'').trim().split(/\s+/);
  return (p[p.length-1] || '?').charAt(0).toUpperCase();
}
function sorted(a){ return [...a].sort((x,y) => ((x.no||0)-(y.no||0)) || String(x.name).localeCompare(String(y.name),'vi')); }
function groupBy(list, fn){
  const g = new Map();
  list.forEach(t => { const k = fn(t); if (!g.has(k)) g.set(k, []); g.get(k).push(t); });
  return g;
}
function viSortKey(u){
  const p = String(u.fullName || '').replace(/\(.*?\)/g,'').trim().split(/\s+/);
  return (p[p.length-1] || '') + ' ' + u.fullName;
}
const PALETTE = [205,168,24,262,338,48,190,128];
function catStyle(cat){
  let h = 0;
  for (const ch of String(cat)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const hue = PALETTE[h % PALETTE.length];
  return '--c:hsl(' + hue + ' 62% 36%);--t:hsl(' + hue + ' 75% 93%)';
}
let toastT;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast'; el.setAttribute('role','status');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ---------- QUY TẮC PHÂN QUYỀN ----------
   1) Quản trị viên xem được tất cả.
   2) Người thường: mặc định theo CHỨC DANH (chức năng nào có tick chức danh của họ).
   3) Ngoại lệ riêng từng người: "cấp thêm" (extraToolIds) hoặc "chặn" (blockedToolIds).
   Chức năng đang ẩn thì không ai thấy ở trang chính. */
function baseAllow(titleId, tool){ return !!titleId && (tool.titleIds || []).includes(titleId); }
function canAccess(u, t){
  if (u.role === 'admin') return true;
  if ((u.blockedToolIds || []).includes(t.id)) return false;
  if ((u.extraToolIds || []).includes(t.id)) return true;
  return baseAllow(u.titleId, t);
}
function toolsFor(u){
  if (!u) return [];
  if (SERVER && ui.me && u.id === ui.me.id) return sorted(ui.myTools);
  return sorted(db.tools.filter(t => t.active && canAccess(u, t)));
}
function activeAdmins(){ return db.users.filter(u => u.role === 'admin' && u.active); }

function checkNewPw(a, b, u){
  if (a.length < 6) return 'Mật khẩu mới tối thiểu 6 ký tự.';
  if (a !== b) return 'Hai lần nhập mật khẩu chưa giống nhau.';
  if (a === db.settings.defaultPassword) return 'Không dùng lại mật khẩu mặc định.';
  if (a.toLowerCase() === u.username) return 'Mật khẩu không được trùng mã nhân viên.';
  return '';
}
function finishLogin(u){
  ui.userId = u.id; lsSet(SESSION_KEY, u.id);
  ui.pendingId = null; ui.page = 'portal'; ui.q = ''; ui.cat = 'all'; ui.viewAs = null;
}
async function doLogin(code, pw){
  if (SERVER){
    let r;
    try { r = await rpc('onemsg_login', { p_username: String(code), p_password: String(pw) }); }
    catch(e){ return e.message === 'NETWORK' ? 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.' : 'Lỗi máy chủ: ' + e.message; }
    if (!r.ok) return SERVER_ERR[r.error] || 'Đăng nhập không thành công.';
    ui.token = r.token; lsSet(TOKEN_KEY, r.token);
    if (r.mustChange){ ui.pendingId = 'server'; ui.pendingName = r.fullName || ''; return ''; }
    try { await loadMe(); } catch(e){ return 'Không tải được dữ liệu: ' + e.message; }
    ui.pendingId = null; ui.page = 'portal'; ui.q = ''; ui.cat = 'all'; ui.viewAs = null;
    return '';
  }
  const u = db.users.find(x => x.username === String(code).trim().toLowerCase());
  if (!u || u.pass !== hashPw(pw)) return 'Sai mã nhân viên hoặc mật khẩu.';
  if (!u.active) return 'Tài khoản đã bị khóa. Liên hệ quản trị viên.';
  if (u.mustChange){ ui.pendingId = u.id; return ''; }
  finishLogin(u);
  return '';
}
function logout(){
  if (SERVER){
    if (ui.token) rpc('onemsg_logout', { p_token: ui.token }).catch(() => {});
    ui.token = null; ui.me = null; ui.myTools = []; lsDel(TOKEN_KEY);
  }
  ui.userId = null; ui.pendingId = null; ui.viewAs = null; ui.page = 'portal';
  lsDel(SESSION_KEY);
  render();
}

function taglineHtml(compact){
  const parts = String(db.settings.tagline || '').split(/\.\s*/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) return '';
  const n = parts.length;
  const spans = parts.map((p, i) => {
    const op = n === 1 ? 1 : (0.45 + 0.55 * i / (n - 1)).toFixed(2);
    return '<span style="opacity:' + op + '">' + esc(p) + (i < n - 1 ? '.' : '') + '</span>';
  }).join('');
  return '<div class="tagline' + (compact ? ' compact' : '') + '">' + spans + '</div>';
}

   TRANG CHÍNH (PORTAL)
   ===================================================================== */
function renderPortal(){
  const u = effectiveUser();
  const list = toolsFor(u);
  const cats = [...new Set(list.map(t => t.category || 'Khác'))];
  if (ui.cat !== 'all' && !cats.includes(ui.cat)) ui.cat = 'all';

  const viewAsBanner = ui.viewAs
    ? '<div class="viewas"><span>Đang xem thử với quyền của <strong>' + esc(u.fullName) + '</strong>' + (titleName(u.titleId) ? ' (' + esc(titleName(u.titleId)) + ')' : '') + '.</span><button class="btn sm" data-act="exitView">Thoát xem thử</button></div>' : '';

  const chips = cats.length > 1
    ? '<div class="chips" role="group" aria-label="Lọc theo nhóm">'
      + '<button class="chip" data-act="cat" data-cat="all" aria-pressed="' + (ui.cat === 'all') + '">Tất cả (' + list.length + ')</button>'
      + cats.map(c => '<button class="chip" data-act="cat" data-cat="' + esc(c) + '" aria-pressed="' + (ui.cat === c) + '">' + esc(c) + ' (' + list.filter(t => (t.category||'Khác') === c).length + ')</button>').join('')
      + '</div>' : '';

  app.innerHTML = topHtml(true)
    + '<main class="wrap">'
    + viewAsBanner
    + '<p class="hello">Xin chào, <strong>' + esc(u.fullName) + '</strong>. Bạn có <strong>' + list.length + '</strong> chức năng.</p>'
    + '<div class="toolbar">'
    +   '<div class="search">' + ICON.search + '<input id="q" type="search" placeholder="Tìm chức năng theo tên, nhóm hoặc số thứ tự" value="' + esc(ui.q) + '" aria-label="Tìm chức năng"></div>'
    +   '<div class="seg" role="group" aria-label="Kiểu hiển thị">'
    +     '<button data-act="view" data-view="cards" aria-pressed="' + (ui.view === 'cards') + '">' + ICON.grid + 'Thẻ</button>'
    +     '<button data-act="view" data-view="table" aria-pressed="' + (ui.view === 'table') + '">' + ICON.list + 'Bảng</button>'
    +   '</div>'
    +   chips
    + '</div>'
    + '<div id="results"></div>'
    + '<p class="foot">Cần thêm quyền truy cập? Liên hệ quản trị viên để được cấp.</p>'
    + '</main>';
  renderResults();
}

function renderResults(){
  const el = document.getElementById('results');
  if (!el) return;
  const u = effectiveUser();
  const all = toolsFor(u);
  let list = all;
  if (ui.cat !== 'all') list = list.filter(t => (t.category || 'Khác') === ui.cat);
  const q = norm(ui.q);
  if (q) list = list.filter(t => norm([t.name, t.desc, t.category, t.no].join(' ')).includes(q));

  if (!all.length){
    el.innerHTML = '<div class="empty"><strong>Chưa có chức năng nào</strong>'
      + (u.role === 'admin' ? 'Vào mục Quản trị để thêm chức năng đầu tiên.' : 'Tài khoản này chưa được cấp quyền. Nhờ quản trị viên kiểm tra chức danh và quyền truy cập của bạn.') + '</div>';
    return;
  }
  if (!list.length){
    el.innerHTML = '<div class="empty"><strong>Không tìm thấy chức năng phù hợp</strong>Thử từ khóa khác hoặc chọn nhóm "Tất cả".</div>';
    return;
  }
  el.innerHTML = ui.view === 'table' ? tableHtml(list) : cardsHtml(list);
}

function linkAttrs(t){
  const u = normUrl(t.url);
  return hasLink(u) ? 'href="' + esc(u) + '" target="_blank" rel="noopener noreferrer"' : 'href="#" data-act="nolink"';
}
function tileHtml(t){
  return '<a class="tile" ' + linkAttrs(t) + ' title="' + esc(t.name) + '">'
    + '<span class="ico" aria-hidden="true">' + esc(t.icon || '🔗') + '</span>'
    + '<span class="tx"><span class="nm">' + esc(t.name) + '</span><span class="ds">' + esc(t.desc) + '</span></span>'
    + '<span class="no">#' + esc(t.no) + '</span></a>';
}
function cardsHtml(list){
  return [...groupBy(list, t => t.category || 'Khác')].map(([c, items]) =>
    '<section class="group" style="' + catStyle(c) + '">'
    + '<h2 class="group-title"><span class="dot"></span>' + esc(c) + '<span class="count">' + items.length + '</span></h2>'
    + '<div class="grid">' + items.map(tileHtml).join('') + '</div></section>').join('');
}
function tableHtml(list){
  return '<div class="tbl-wrap"><table><thead><tr><th class="num">#</th><th>Tên chức năng</th><th>Nhóm</th><th>Mô tả</th><th></th></tr></thead><tbody>'
    + list.map(t =>
      '<tr><td class="num muted">' + esc(t.no) + '</td>'
      + '<td><a class="nmcell" style="text-decoration:none" ' + linkAttrs(t) + '><span class="e" aria-hidden="true">' + esc(t.icon || '🔗') + '</span>' + esc(t.name) + '</a></td>'
      + '<td><span class="badge" style="' + catStyle(t.category || 'Khác') + '">' + esc(t.category || 'Khác') + '</span></td>'
      + '<td class="muted small">' + esc(t.desc) + '</td>'
      + '<td style="text-align:right"><a class="btn sm primary" ' + linkAttrs(t) + '>Mở ' + ICON.ext + '</a></td></tr>').join('')
    + '</tbody></table></div>';
}

  const body = document.getElementById('adminBody');

/* ---------- Tab Chức năng ---------- */
function titleBadges(t){
  const names = (t.titleIds || []).map(titleName).filter(Boolean);
  if (!names.length) return '<span class="badge warn">Chưa cấp cho chức danh nào</span>';
  const shown = names.slice(0, 3).map(n => '<span class="badge info">' + esc(n) + '</span>').join('');
  return '<div class="badges">' + shown + (names.length > 3 ? '<span class="badge gray">+' + (names.length - 3) + '</span>' : '') + '</div>';
}
function toolsTab(){
  const rows = sorted(db.tools).map(t => {
    const n = db.users.filter(u => u.role !== 'admin' && u.active && canAccess(u, t)).length;
    const u = normUrl(t.url);
    return '<tr>'
      + '<td class="num muted">' + esc(t.no) + '</td>'
      + '<td><div class="nmcell"><span class="e" aria-hidden="true">' + esc(t.icon || '🔗') + '</span>' + esc(t.name) + '</div></td>'
      + '<td><span class="badge" style="' + catStyle(t.category || 'Khác') + '">' + esc(t.category || 'Khác') + '</span></td>'
      + '<td class="small">' + (hasLink(u) ? '<div class="trunc">' + esc(hostOf(u)) + '</div>' : '<span class="muted">Chưa gắn link</span>') + '</td>'
      + '<td>' + titleBadges(t) + '</td>'
      + '<td class="small">' + n + ' người</td>'
      + '<td>' + (t.active ? '<span class="badge ok">Hiển thị</span>' : '<span class="badge gray">Đang ẩn</span>') + '</td>'
      + '<td><div class="acts"><button class="btn sm" data-act="toolEdit" data-id="' + esc(t.id) + '">Sửa</button><button class="btn sm danger" data-act="toolDel" data-id="' + esc(t.id) + '">Xóa</button></div></td></tr>';
  }).join('');
  return '<div class="bar"><span class="muted">' + db.tools.length + ' chức năng. Khi thêm hoặc sửa, tick các chức danh được xem. Quản trị viên luôn thấy tất cả.</span>'
    + '<button class="btn primary" data-act="toolNew">+ Thêm chức năng</button></div>'
    + '<div class="tbl-wrap" style="margin-top:0"><table style="min-width:980px"><thead><tr><th class="num">#</th><th>Chức năng</th><th>Nhóm</th><th>Link</th><th>Chức danh được xem</th><th>Người xem được</th><th>Trạng thái</th><th></th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">Chưa có chức năng nào.</td></tr>')
    + '</tbody></table></div>';
}

  const titles = titlesSorted();

  if (!db.tools.length) return '<div class="empty"><strong>Chưa có chức năng nào</strong>Thêm chức năng ở tab "Chức năng".</div>';
  const head = '<tr><th>Chức năng</th>' + titles.map(c =>
    '<th data-col="' + esc(c.id) + '">' + esc(c.name) + '<button class="link" data-act="matCol" data-id="' + esc(c.id) + '">Cả cột</button></th>').join('') + '</tr>';
  const rows = sorted(db.tools).map(t =>
    '<tr><td><div class="nmcell"><span class="e" aria-hidden="true">' + esc(t.icon || '🔗') + '</span><span>' + esc(t.name) + '<div class="catline">#' + esc(t.no) + ' · ' + esc(t.category || 'Khác') + (t.active ? '' : ' · đang ẩn') + '</div></span></div></td>'
    + titles.map(c => '<td class="cellchk" data-col="' + esc(c.id) + '"><input type="checkbox" data-mat data-t="' + esc(t.id) + '" data-c="' + esc(c.id) + '" aria-label="' + esc(t.name + ' - ' + c.name) + '"' + ((t.titleIds || []).includes(c.id) ? ' checked' : '') + '></td>').join('')
    + '</tr>').join('');
  return '<div class="bar"><span class="muted">Tick để cho phép chức danh xem chức năng. Thay đổi được lưu ngay. Ngoại lệ từng người chỉnh ở tab Người dùng.</span>'
    + '<div class="ufilters"><input id="matq" type="search" placeholder="Lọc cột theo chức danh, ví dụ: điều dưỡng" aria-label="Lọc cột theo chức danh" value="' + esc(ui.matq) + '"></div></div>'
    + '<div class="tbl-wrap matrix" style="margin-top:0"><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';
}
function applyMatFilter(){
  const q = norm(ui.matq || '');
  document.querySelectorAll('.matrix [data-col]').forEach(el => {
    const c = titleOf(el.dataset.col);
    el.hidden = !!q && !(c && norm(c.name).includes(q));
  });
}

    + (none ? ' Có <strong>' + none + '</strong> người chưa có chức danh (họ sẽ không thấy chức năng nào, trừ ngoại lệ).' : '') + '</span>'

/* ---------- Tab Người dùng ---------- */
function usersTab(){
  return '<div class="bar">'
    + '<div class="ufilters"><input id="uq" type="search" placeholder="Tìm theo mã, họ tên, chức danh, khoa/phòng" aria-label="Tìm người dùng" value="' + esc(ui.uq) + '">'
    + '<select id="ut" aria-label="Lọc theo chức danh"><option value="all">Tất cả chức danh</option>'
    + titlesSorted().map(c => '<option value="' + esc(c.id) + '"' + (ui.ut === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('')
    + '<option value="none"' + (ui.ut === 'none' ? ' selected' : '') + '>Chưa có chức danh</option></select>'
    + '<select id="ud" aria-label="Lọc theo khoa/phòng"><option value="all">Tất cả khoa/phòng</option>'
    + userDepts().map(x => '<option value="' + esc(x) + '"' + (ui.ud === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('')
    + '</select></div>'
    + '<div class="btns"><button class="btn" data-act="tplDownload">Tải file mẫu</button><button class="btn" data-act="userImport">Import từ Excel</button><button class="btn primary" data-act="userNew">+ Thêm người dùng</button></div>'
    + '</div><div id="userList"></div>';
}
function filteredUsers(){
  const q = norm(ui.uq);
  return db.users.filter(u => {
    if (ui.ut === 'none' && u.titleId) return false;
    if (ui.ut !== 'all' && ui.ut !== 'none' && u.titleId !== ui.ut) return false;
    if (ui.ud !== 'all' && u.dept !== ui.ud) return false;
    if (q && !norm([u.fullName, u.username, u.dept, u.unit, titleName(u.titleId)].join(' ')).includes(q)) return false;
    return true;
  }).sort((a, b) => viSortKey(a).localeCompare(viSortKey(b), 'vi'));
}
function renderUserList(){
  const el = document.getElementById('userList');
  if (!el) return;
  const all = filteredUsers();
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  if (ui.upage > pages) ui.upage = pages;
  const slice = all.slice((ui.upage - 1) * PAGE_SIZE, ui.upage * PAGE_SIZE);
  const selectable = slice.filter(u => u.role !== 'admin');
  const allOnPage = selectable.length > 0 && selectable.every(u => ui.sel.has(u.id));

  const selBar = ui.sel.size
    ? '<div class="sel-bar"><strong>Đã chọn ' + ui.sel.size + ' người</strong>'
      + '<button class="btn sm" data-act="bulkAll">Chọn tất cả ' + all.filter(u => u.role !== 'admin').length + ' người trong bộ lọc</button>'
      + '<button class="btn sm" data-act="bulkReset">Đặt lại mật khẩu về mặc định</button>'
      + '<button class="btn sm" data-act="bulkLock">Khóa</button><button class="btn sm" data-act="bulkUnlock">Mở khóa</button>'
      + '<button class="btn sm danger" data-act="bulkDel">Xóa</button><button class="btn sm" data-act="bulkClear">Bỏ chọn</button></div>' : '';

  const rows = slice.map(u => {
    const ex = (u.extraToolIds || []).length, bl = (u.blockedToolIds || []).length;
    const exc = (ex || bl) ? ('<span class="exc add">' + (ex ? '+' + ex : '') + '</span> <span class="exc blk">' + (bl ? '−' + bl : '') + '</span>') : '<span class="muted">-</span>';
    const status = !u.active ? '<span class="badge gray">Đã khóa</span>' : u.mustChange ? '<span class="badge warn">Chờ đổi mật khẩu</span>' : '<span class="badge ok">Hoạt động</span>';
    const tname = titleName(u.titleId);
    return '<tr>'
      + '<td class="chk">' + (u.role === 'admin' ? '' : '<input type="checkbox" data-sel="' + esc(u.id) + '" aria-label="Chọn ' + esc(u.fullName) + '"' + (ui.sel.has(u.id) ? ' checked' : '') + '>') + '</td>'
      + '<td class="small">' + esc(u.username) + '</td>'
      + '<td><div style="font-weight:600">' + esc(u.fullName) + '</div>' + (u.role === 'admin' ? '<div class="small" style="color:hsl(262 62% 36%)">Quản trị viên</div>' : '') + '</td>'
      + '<td>' + (tname ? '<span class="badge info">' + esc(tname) + '</span>' : (u.role === 'admin' ? '<span class="muted">-</span>' : '<span class="badge warn">Chưa có</span>')) + '</td>'
      + '<td class="small">' + esc(u.dept || '') + (u.unit ? '<div class="muted">' + esc(u.unit) + '</div>' : '') + '</td>'
      + '<td class="small">' + exc + '</td>'
      + '<td>' + status + '</td>'
      + '<td><div class="acts">'
      +   (u.role !== 'admin' ? '<button class="btn sm" data-act="userView" data-id="' + esc(u.id) + '">Xem thử</button>' : '')
      +   '<button class="btn sm" data-act="userEdit" data-id="' + esc(u.id) + '">Sửa</button>'
      +   '<button class="btn sm danger" data-act="userDel" data-id="' + esc(u.id) + '">Xóa</button>'
      + '</div></td></tr>';
  }).join('');

  const pager = '<div class="pager"><span>' + all.length + ' / ' + db.users.length + ' tài khoản'
    + (pages > 1 ? ' · Trang ' + ui.upage + '/' + pages : '') + '</span>'
    + (pages > 1 ? '<div class="btns"><button class="btn sm" data-act="upage" data-p="' + (ui.upage - 1) + '"' + (ui.upage <= 1 ? ' disabled' : '') + '>Trước</button><button class="btn sm" data-act="upage" data-p="' + (ui.upage + 1) + '"' + (ui.upage >= pages ? ' disabled' : '') + '>Sau</button></div>' : '') + '</div>';

  el.innerHTML = selBar
    + '<div class="tbl-wrap" style="margin-top:0"><table style="min-width:900px"><thead><tr>'
    + '<th class="chk"><input type="checkbox" id="selAll" aria-label="Chọn cả trang"' + (allOnPage ? ' checked' : '') + '></th>'
    + '<th>Mã NV</th><th>Họ tên</th><th>Chức danh</th><th>Khoa/Phòng</th><th>Ngoại lệ</th><th>Trạng thái</th><th></th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">Không có người dùng phù hợp.</td></tr>')
    + '</tbody></table></div>' + pager;
}

/* ---------- Tab Cài đặt ---------- */

/* =====================================================================
   HỘP THOẠI
   ===================================================================== */
function openDialog(opt){
  const d = document.createElement('dialog');
  d.innerHTML = '<form class="dlg" novalidate>'
    + '<div class="dlg-head"><span>' + esc(opt.title) + '</span><button type="button" class="x" data-close aria-label="Đóng">×</button></div>'
    + '<div class="dlg-body">' + opt.body + '</div>'
    + '<div class="dlg-foot"><div class="dlg-err" role="alert"></div><button type="button" class="btn" data-close>Hủy</button><button type="submit" class="btn primary">' + esc(opt.saveLabel || 'Lưu') + '</button></div>'
    + '</form>';
  document.body.appendChild(d);
  d.addEventListener('click', ev => { if (ev.target.closest('[data-close]')) d.close(); });
  d.addEventListener('close', () => d.remove());
  d.querySelector('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = d.querySelector('button[type=submit]');
    if (btn.disabled) return;
    btn.disabled = true;
    let err;
    try { err = await opt.onSave(d); } catch(e){ err = 'Không lưu được. Kiểm tra kết nối rồi thử lại.'; }
    btn.disabled = false;
    if (!d.isConnected) return;
    if (err) d.querySelector('.dlg-err').textContent = err; else d.close();
  });
  if (opt.onOpen) opt.onOpen(d);
  d.showModal();
  const first = d.querySelector('input:not([type=checkbox]):not([type=file]),textarea,select');
  if (first) first.focus();
  return d;
}
function confirmBox(msgHtml, okLabel){
  return new Promise(res => {
    let ok = false;
    const d = document.createElement('dialog');
    d.innerHTML = '<div class="dlg"><div class="dlg-head"><span>Xác nhận</span></div><div class="dlg-body"><p>' + msgHtml + '</p></div>'
      + '<div class="dlg-foot"><button class="btn" data-no>Hủy</button><button class="btn danger" data-yes>' + esc(okLabel || 'Xóa') + '</button></div></div>';
    d.addEventListener('click', e => {
      if (e.target.closest('[data-yes]')){ ok = true; d.close(); }
      else if (e.target.closest('[data-no]')) d.close();
    });
    d.addEventListener('close', () => { d.remove(); res(ok); });
    document.body.appendChild(d);
    d.showModal();
  });
}

/* ---------- Thêm / sửa chức năng ---------- */
function toolDialog(id){
  const t = id ? db.tools.find(x => x.id === id) : null;
  const cats = [...new Set(db.tools.map(x => x.category).filter(Boolean))];
  const nextNo = Math.max(0, ...db.tools.map(x => x.no || 0)) + 1;
  const have = new Set(t ? (t.titleIds || []) : []);
  const body =
    '<div class="row3">'
    + '<div class="field"><label>Số thứ tự</label><input name="no" type="number" min="1" value="' + esc(t ? t.no : nextNo) + '"></div>'
    + '<div class="field"><label>Biểu tượng</label><input name="icon" maxlength="8" value="' + esc(t ? t.icon : '🔗') + '"></div>'
    + '<div class="field"><label>Tên chức năng *</label><input name="name" value="' + esc(t ? t.name : '') + '"></div>'
    + '</div>'
    + '<div class="field"><label>Mô tả ngắn</label><textarea name="desc" maxlength="200">' + esc(t ? t.desc : '') + '</textarea></div>'
    + '<div class="field"><label>Link chức năng</label><input name="url" placeholder="https://..." value="' + esc(t ? t.url : '') + '"><span class="hint">Bỏ trống nếu chưa có link. Người dùng bấm vào sẽ thấy thông báo "chưa gắn link".</span></div>'
    + '<div class="row2">'
    + '<div class="field"><label>Nhóm chức năng</label><input name="category" list="catlist" value="' + esc(t ? t.category : '') + '" placeholder="Ví dụ: BHYT"><datalist id="catlist">' + cats.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist></div>'
    + '<div class="field"><label>Trạng thái</label><select name="active"><option value="1"' + (!t || t.active ? ' selected' : '') + '>Hiển thị</option><option value="0"' + (t && !t.active ? ' selected' : '') + '>Ẩn tạm thời</option></select></div>'
    + '</div>'
    + '<div class="field"><label>Chức danh được xem</label>'
    + (db.titles.length
      ? '<input type="search" data-cfilter placeholder="Lọc chức danh, ví dụ: bác sĩ" aria-label="Lọc chức danh" style="margin-bottom:6px">'
        + '<div class="perm"><div class="perm-top"><strong>' + db.titles.length + ' chức danh</strong><span><button type="button" class="link" data-all="on">Chọn tất cả</button> &nbsp; <button type="button" class="link" data-all="off">Bỏ chọn</button></span></div>'
        + titlesSorted().map(c => '<label data-name="' + esc(norm(c.name)) + '"><input type="checkbox" name="cid" value="' + esc(c.id) + '"' + (have.has(c.id) ? ' checked' : '') + '> ' + esc(c.name) + ' <span class="muted small">(' + db.users.filter(u => u.titleId === c.id).length + ' người)</span></label>').join('') + '</div>'
        + '<span class="hint">Khi đang lọc, nút "Chọn tất cả" và "Bỏ chọn" chỉ áp dụng cho các chức danh đang hiển thị.</span>'
      : '<span class="hint">Chưa có chức danh nào. Thêm ở tab Chức danh hoặc import người dùng.</span>')
    + '<span class="hint">Quản trị viên luôn thấy tất cả. Ngoại lệ cho từng người chỉnh ở tab Người dùng.</span></div>';

  openDialog({
    title: t ? 'Sửa chức năng' : 'Thêm chức năng',
    body,
    onOpen(d){
      d.addEventListener('click', ev => {
        const b = ev.target.closest('[data-all]');
        if (b) d.querySelectorAll('[name=cid]').forEach(c => { if (!c.closest('label').hidden) c.checked = b.dataset.all === 'on'; });
      });
      d.addEventListener('input', ev => {
        if (!ev.target.matches('[data-cfilter]')) return;
        const q = norm(ev.target.value);
        d.querySelectorAll('[name=cid]').forEach(c => { const lb = c.closest('label'); lb.hidden = !!q && !lb.dataset.name.includes(q); });
      });
    },
    async onSave(d){
      const v = n => d.querySelector('[name=' + n + ']').value.trim();
      const name = v('name');
      if (!name) return 'Vui lòng nhập tên chức năng.';
      const no = parseInt(v('no'), 10) || nextNo;
      const dup = db.tools.find(x => x.no === no && (!t || x.id !== t.id));
      if (dup) return 'Số thứ tự #' + no + ' đã dùng cho "' + dup.name + '". Chọn số khác.';
      const rawUrl = v('url');
      const url = normUrl(rawUrl);
      if (rawUrl && !url) return 'Link không hợp lệ.';
      if (SERVER){
        const r = await call('onemsg_admin_save_tool', { p_token: ui.token, p_tool: {
          id: t ? t.id : null, no, icon: v('icon') || '🔗', name, desc: v('desc'), url, category: v('category') || 'Khác',
          active: v('active') === '1', titleIds: [...d.querySelectorAll('[name=cid]:checked')].map(x => x.value) } });
        if (!r.ok) return r.error;
        await loadAdmin(); render(); toast('Đã lưu chức năng');
        return '';
      }
      let tool = t;
      if (!tool){ tool = { id: uid() }; db.tools.push(tool); }
      Object.assign(tool, {
        no, icon: v('icon') || '🔗', name, desc: v('desc'), url, category: v('category') || 'Khác', active: v('active') === '1',
        titleIds: [...d.querySelectorAll('[name=cid]:checked')].map(x => x.value)
      });
      save(); render(); toast('Đã lưu chức năng');
      return '';
    }
  });
}

/* ---------- Thêm / sửa chức danh ---------- */
function titleDialog(id){
  const c = id ? titleOf(id) : null;
  openDialog({
    title: c ? 'Đổi tên chức danh' : 'Thêm chức danh',
    body: '<div class="field"><label>Tên chức danh *</label><input name="tname" maxlength="60" value="' + esc(c ? c.name : '') + '" placeholder="Ví dụ: Kỹ thuật viên"></div>',
    async onSave(d){
      const name = d.querySelector('[name=tname]').value.trim().replace(/\s+/g, ' ');
      if (!name) return 'Vui lòng nhập tên chức danh.';
      if (db.titles.some(x => norm(x.name) === norm(name) && (!c || x.id !== c.id))) return 'Chức danh này đã có.';
      if (SERVER){
        const r = await call('onemsg_admin_save_title', { p_token: ui.token, p_name: name, p_id: c ? c.id : null });
        if (!r.ok) return r.error;
        await loadAdmin(); render(); toast('Đã lưu chức danh');
        return '';
      }
      if (c) c.name = name; else db.titles.push({ id: uid(), name });
      save(); render(); toast('Đã lưu chức danh');
      return '';
    }
  });
}

/* ---------- Thêm / sửa người dùng (có ngoại lệ) ---------- */
function userDialog(id){
  const u = id ? db.users.find(x => x.id === id) : null;
  const groups = groupBy(sorted(db.tools), t => t.category || 'Khác');
  const isAdmin = !!u && u.role === 'admin';
  // overrides: id chức năng -> true (cấp thêm) | false (chặn)
  const overrides = new Map();
  if (u){
    (u.extraToolIds || []).forEach(x => overrides.set(x, true));
    (u.blockedToolIds || []).forEach(x => overrides.set(x, false));
  }
  const toolById = new Map(db.tools.map(t => [t.id, t]));

  const perm = '<div class="perm-top"><strong>Chức năng người này xem được</strong><span><button type="button" class="link" data-reset>Về mặc định theo chức danh</button></span></div>'
    + '<div class="hint" style="margin-bottom:6px" id="permHint"></div>'
    + '<div class="perm">'
    + ([...groups].map(([c, items]) =>
        '<div class="perm-group"><h4><span>' + esc(c) + '</span><span><button type="button" class="link" data-grp="on">Chọn cả nhóm</button> &nbsp; <button type="button" class="link" data-grp="off">Bỏ</button></span></h4>'
        + items.map(t => '<label><input type="checkbox" name="tid" value="' + esc(t.id) + '"> <span aria-hidden="true">' + esc(t.icon || '') + '</span> ' + esc(t.name) + (t.active ? '' : ' <span class="muted small">(đang ẩn)</span>') + '<span class="exc" data-exc="' + esc(t.id) + '"></span></label>').join('')
        + '</div>').join('') || '<span class="hint">Chưa có chức năng nào.</span>')
    + '</div>';

  const body =
    '<div class="row2">'
    + '<div class="field"><label>Họ tên *</label><input name="fullName" value="' + esc(u ? u.fullName : '') + '"></div>'
    + '<div class="field"><label>Mã nhân viên (dùng để đăng nhập) *</label><input name="username" autocomplete="off" value="' + esc(u ? u.username : '') + '"><span class="hint">Chữ thường không dấu, số, . _ - (tối thiểu 2 ký tự).</span></div>'
    + '</div>'
    + '<div class="row2">'
    + '<div class="field"><label>Chức danh</label><select name="titleId"><option value="">- Chưa có -</option>'
    +   titlesSorted().map(c => '<option value="' + esc(c.id) + '"' + (u && u.titleId === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></div>'
    + '<div class="field"><label>Khoa / Phòng</label><input name="dept" list="deptlist" value="' + esc(u ? u.dept : '') + '"><datalist id="deptlist">' + deptOptions().map(x => '<option value="' + esc(x) + '">').join('') + '</datalist></div>'
    + '</div>'
    + '<div class="row2">'
    + '<div class="field"><label>Bộ phận</label><input name="unit" value="' + esc(u ? (u.unit || '') : '') + '" placeholder="Nếu có"></div>'
    + '<div class="field"><label>Vai trò</label><select name="role"><option value="user"' + (!isAdmin ? ' selected' : '') + '>Người dùng</option><option value="admin"' + (isAdmin ? ' selected' : '') + '>Quản trị viên</option></select></div>'
    + '</div>'
    + '<div class="row2">'
    + '<div class="field"><label>' + (u ? 'Mật khẩu mới' : 'Mật khẩu') + '</label><input name="password" type="text" autocomplete="off" placeholder="' + (u ? 'Bỏ trống nếu không đổi' : 'Bỏ trống = dùng mật khẩu mặc định') + '"></div>'
    + '<div class="field"><label>Trạng thái</label><select name="active"><option value="1"' + (!u || u.active ? ' selected' : '') + '>Hoạt động</option><option value="0"' + (u && !u.active ? ' selected' : '') + '>Khóa tài khoản</option></select></div>'
    + '</div>'
    + '<div class="field"><label class="check"><input type="checkbox" name="mustChange"' + (!u || u.mustChange ? ' checked' : '') + '> Bắt đổi mật khẩu khi đăng nhập lần đầu</label></div>'
    + '<div class="field" id="permBox"' + (isAdmin ? ' hidden' : '') + '>' + perm + '</div>'
    + '<div class="field hint" id="adminNote"' + (isAdmin ? '' : ' hidden') + '>Quản trị viên luôn thấy tất cả chức năng và vào được trang Quản trị.</div>';

  openDialog({
    title: u ? 'Sửa người dùng' : 'Thêm người dùng',
    body,
    onOpen(d){
      const curTitle = () => d.querySelector('[name=titleId]').value;
      const baseOf = tid => { const t = toolById.get(tid); return t ? baseAllow(curTitle(), t) : false; };
      function sync(){
        const ti = curTitle();
        d.querySelectorAll('[name=tid]').forEach(c => {
          const base = baseOf(c.value);
          if (overrides.has(c.value) && overrides.get(c.value) === base) overrides.delete(c.value);
          c.checked = overrides.has(c.value) ? overrides.get(c.value) : base;
          const tag = d.querySelector('[data-exc="' + c.value + '"]');
          if (c.checked && !base){ tag.textContent = 'cấp thêm'; tag.className = 'exc add'; }
          else if (!c.checked && base){ tag.textContent = 'bị chặn'; tag.className = 'exc blk'; }
          else { tag.textContent = ''; tag.className = 'exc'; }
        });
        const hint = d.querySelector('#permHint');
        if (hint) hint.textContent = ti
          ? 'Mặc định theo chức danh "' + titleName(ti) + '". Tick hoặc bỏ tick để tạo ngoại lệ riêng cho người này.'
          : 'Chưa chọn chức danh: người này chỉ thấy các chức năng được cấp thêm ở dưới.';
      }
      function setVal(tid, val){
        if (baseOf(tid) === val) overrides.delete(tid); else overrides.set(tid, val);
      }
      sync();
      d.addEventListener('click', ev => {
        if (ev.target.closest('[data-reset]')){ overrides.clear(); sync(); return; }
        const g = ev.target.closest('[data-grp]');
        if (g){
          g.closest('.perm-group').querySelectorAll('[name=tid]').forEach(c => setVal(c.value, g.dataset.grp === 'on'));
          sync();
        }
      });
      d.addEventListener('change', ev => {
        const el = ev.target;
        if (el.name === 'tid'){ setVal(el.value, el.checked); sync(); }
        else if (el.name === 'titleId'){ sync(); }
        else if (el.name === 'role'){
          const adm = el.value === 'admin';
          d.querySelector('#permBox').hidden = adm;
          d.querySelector('#adminNote').hidden = !adm;
        }
      });
    },
    async onSave(d){
      const v = n => d.querySelector('[name=' + n + ']').value.trim();
      const fullName = v('fullName');
      const username = v('username').toLowerCase();
      const pw = d.querySelector('[name=password]').value;
      const role = v('role'), active = v('active') === '1';
      if (!fullName) return 'Vui lòng nhập họ tên.';
      if (!/^[a-z0-9._-]{2,}$/.test(username)) return 'Mã nhân viên chỉ gồm chữ thường không dấu, số, . _ - và tối thiểu 2 ký tự.';
      if (db.users.some(x => x.username === username && (!u || x.id !== u.id))) return 'Mã nhân viên này đã có người dùng.';
      if (pw && pw.length < 6) return 'Mật khẩu tối thiểu 6 ký tự.';
      if (u && u.role === 'admin' && (role !== 'admin' || !active)){
        if (u.id === me().id) return 'Không thể tự hạ quyền hoặc khóa chính tài khoản đang đăng nhập.';
        if (activeAdmins().filter(x => x.id !== u.id).length === 0) return 'Phải còn ít nhất một quản trị viên đang hoạt động.';
      }
      const titleId = v('titleId');
      const extra = [], blocked = [];
      d.querySelectorAll('[name=tid]').forEach(c => {
        const t = toolById.get(c.value);
        const base = t ? baseAllow(titleId, t) : false;
        if (c.checked && !base) extra.push(c.value);
        if (!c.checked && base) blocked.push(c.value);
      });
      if (SERVER){
        const r = await call('onemsg_admin_save_user', { p_token: ui.token, p_user: {
          id: u ? u.id : null, username, fullName, dept: v('dept'), unit: v('unit'), titleId, role, active,
          mustChange: d.querySelector('[name=mustChange]').checked, password: pw,
          extraToolIds: role === 'admin' ? [] : extra, blockedToolIds: role === 'admin' ? [] : blocked } });
        if (!r.ok) return r.error;
        await loadAdmin(); render(); toast('Đã lưu người dùng');
        return '';
      }
      let rec = u;
      if (!rec){ rec = { id: uid(), pass: hashPw(pw || db.settings.defaultPassword) }; db.users.push(rec); }
      Object.assign(rec, { fullName, dept: v('dept'), unit: v('unit'), username, role, active, titleId, mustChange: d.querySelector('[name=mustChange]').checked });
      if (u && pw) rec.pass = hashPw(pw);
      if (role !== 'admin'){ rec.extraToolIds = extra; rec.blockedToolIds = blocked; }
      else { rec.extraToolIds = rec.extraToolIds || []; rec.blockedToolIds = rec.blockedToolIds || []; }
      save(); render(); toast('Đã lưu người dùng');
      return '';
    }
  });
}

/* ---------- Đổi mật khẩu (tự nguyện) ---------- */
function pwDialog(){
  const u = me();
  openDialog({
    title: 'Đổi mật khẩu',
    body: '<div class="field"><label>Mật khẩu hiện tại</label><input name="cur" type="password" autocomplete="current-password"></div>'
      + '<div class="field"><label>Mật khẩu mới</label><input name="n1" type="password" autocomplete="new-password"><span class="hint">Tối thiểu 6 ký tự.</span></div>'
      + '<div class="field"><label>Nhập lại mật khẩu mới</label><input name="n2" type="password" autocomplete="new-password"></div>',
    async onSave(d){
      const g = n => d.querySelector('[name=' + n + ']').value;
      if (SERVER){
        if (g('n1').length < 6) return 'Mật khẩu mới tối thiểu 6 ký tự.';
        if (g('n1') !== g('n2')) return 'Hai lần nhập mật khẩu chưa giống nhau.';
        const r = await call('onemsg_change_password', { p_token: ui.token, p_new: g('n1'), p_current: g('cur') });
        if (!r.ok) return r.error;
        toast('Đã đổi mật khẩu');
        return '';
      }
      if (u.pass !== hashPw(g('cur'))) return 'Mật khẩu hiện tại chưa đúng.';
      const err = checkNewPw(g('n1'), g('n2'), u);
      if (err) return err;
      u.pass = hashPw(g('n1')); u.mustChange = false;
      save(); toast('Đã đổi mật khẩu');
      return '';
    }
  });
}

function findCol(keys, list){
  for (const k of list){ const i = keys.indexOf(k); if (i >= 0) return i; }
  return -1;
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function readSheetRows(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('read'));
    if (/\.(csv|txt)$/i.test(file.name)){
      rd.onload = () => res(parseCSV(String(rd.result)));
      rd.readAsText(file, 'utf-8');
    } else {
      if (!window.XLSX){ rej(new Error('nolib')); return; }
      rd.onload = () => {
        try {
          const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          res(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }));
        } catch(e){ rej(new Error('parse')); }
      };
      rd.readAsArrayBuffer(file);
    }
  });
}
function analyzeImport(rows){
  let hi = -1, col = {};
  for (let i = 0; i < Math.min(rows.length, 15); i++){
    const keys = rows[i].map(key);
    const c = { code: findCol(keys, HDR.code), name: findCol(keys, HDR.name), title: findCol(keys, HDR.title),
                dept: findCol(keys, HDR.dept), unit: findCol(keys, HDR.unit), leave: findCol(keys, HDR.leave) };
    if (c.code >= 0 && c.name >= 0){ hi = i; col = c; break; }
  }
  if (hi < 0) return { fatal: 'Không tìm thấy dòng tiêu đề có cột "Mã nhân viên" (hoặc "Mã NV") và "Họ tên" (hoặc "Họ và Tên"). Hãy dùng file mẫu hoặc file Bảng công tổng hợp.' };

  const titleByKey = new Map(db.titles.map(t => [norm(t.name), t]));
  const newTitleNames = new Map();
  const seen = new Map();
  const items = [];
  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i];
    if (!r) continue;
    const cell = k => (k >= 0 && r[k] != null) ? String(r[k]).trim() : '';
    const it = {
      row: i + 1,
      code: cell(col.code).toLowerCase().replace(/\s+/g, ''),
      name: cell(col.name).replace(/\s+/g, ' '),
      title: cell(col.title).replace(/\s+/g, ' '),
      dept: cell(col.dept).replace(/\s+/g, ' '),
      unit: cell(col.unit).replace(/\s+/g, ' '),
      leave: cell(col.leave),
      status: 'new', msg: '', warn: '', lock: false
    };
    // Bỏ qua dòng trống và dòng tiêu đề nhóm (ví dụ tên khoa nằm riêng một dòng)
    if (!it.code && !it.name && !it.title && !it.dept) continue;
    if (!it.code) { it.status = 'error'; it.msg = 'Thiếu mã nhân viên'; }
    else if (!it.name) { it.status = 'error'; it.msg = 'Thiếu họ tên'; }
    else if (!/^[a-z0-9._-]{2,}$/.test(it.code)) { it.status = 'error'; it.msg = 'Mã nhân viên chỉ gồm chữ, số, . _ - (không dấu, không khoảng trắng)'; }
    else if (seen.has(it.code)) { it.status = 'error'; it.msg = 'Trùng mã trong file (đã có ở dòng ' + seen.get(it.code) + ')'; }
    else {
      seen.set(it.code, it.row);
      const ex = db.users.find(x => x.username === it.code);
      if (ex && ex.role === 'admin'){ it.status = 'error'; it.msg = 'Trùng tài khoản quản trị viên'; }
      else if (it.leave){ it.status = 'left'; it.lock = !!ex && ex.active; }
      else if (ex) it.status = 'update';
      if ((it.status === 'new' || it.status === 'update') && it.title && !titleByKey.has(norm(it.title)) && !newTitleNames.has(norm(it.title))) newTitleNames.set(norm(it.title), it.title);
      if (it.status === 'new' && !it.title) it.warn = 'chưa có chức danh';
    }
    items.push(it);
  }
  const count = s => items.filter(x => x.status === s).length;
  return { items, newTitles: [...newTitleNames.values()],
    nNew: count('new'), nUpd: count('update'), nErr: count('error'), nLeft: count('left'),
    nLock: items.filter(x => x.status === 'left' && x.lock).length,
    nWarn: items.filter(x => x.warn).length };
}
function applyImport(res){
  const byKey = new Map(db.titles.map(t => [norm(t.name), t]));
  res.newTitles.forEach(n => { const t = { id: uid(), name: n }; db.titles.push(t); byKey.set(norm(n), t); });
  const pw = hashPw(db.settings.defaultPassword);
  res.items.forEach(it => {
    if (it.status === 'error') return;
    if (it.status === 'left'){
      if (it.lock){ const x = db.users.find(y => y.username === it.code); if (x && x.role !== 'admin') x.active = false; }
      return;
    }
    const t = it.title ? byKey.get(norm(it.title)) : null;
    let u = db.users.find(x => x.username === it.code);
    if (!u){
      u = { id: uid(), username: it.code, pass: pw, role: 'user', active: true, mustChange: true, titleId: '', dept: '', unit: '', extraToolIds: [], blockedToolIds: [] };
      db.users.push(u);
    }
    u.fullName = it.name;
    if (it.dept) u.dept = it.dept;
    if (it.unit) u.unit = it.unit;
    if (t) u.titleId = t.id;
  });
  save();
}
async function applyImportServer(res){
  const byKey = new Map(db.titles.map(t => [norm(t.name), t.name]));
  const rows = res.items.filter(it => it.status !== 'error').map(it => ({
    code: it.code, name: it.name, title: it.title ? (byKey.get(norm(it.title)) || it.title) : '',
    dept: it.dept, unit: it.unit, left: it.status === 'left' }));
  const tot = { created: 0, updated: 0, locked: 0, skipped: 0, newTitles: 0 };
  for (let i = 0; i < rows.length; i += 100){
    const r = await call('onemsg_admin_import', { p_token: ui.token, p_rows: rows.slice(i, i + 100) });
    for (const k in tot) tot[k] += (r[k] || 0);
  }
  return tot;
}

            : 'Không đọc được file. Kiểm tra lại file có đúng định dạng .xlsx/.xls/.csv không.') + '</p>';

    async onSave(){

function downloadTemplate(){
  const head = ['Mã nhân viên','Họ tên','Chức danh','Khoa/Phòng','Bộ phận'];
  const sample = [
    ['DKTK0001','Nguyễn Văn A','Bác sĩ lâm sàng','Khoa Nội - Nhi',''],
    ['DKTK0002','Trần Thị B','Điều dưỡng','Khoa Ngoại',''],
    ['DKTK0003','Lê Văn C','Nhân viên kế toán','Phòng Tài chính kế toán','Kế toán bảo hiểm']
  ];
  if (window.XLSX){
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([head].concat(sample));
    ws['!cols'] = [{ wch: 16 }, { wch: 28 }, { wch: 32 }, { wch: 42 }, { wch: 26 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Nguoi dung');
    const help = XLSX.utils.aoa_to_sheet([
      ['Hướng dẫn'],
      ['1. Giữ nguyên dòng tiêu đề, điền mỗi người một dòng, xóa 3 dòng ví dụ. Cột Bộ phận có thể để trống.'],
      ['2. Mã nhân viên dùng để đăng nhập: chữ, số, dấu . _ - (không dấu, không khoảng trắng). Nên định dạng cột này là Text.'],
      ['3. Chức danh và Khoa/Phòng gõ giống file Bảng công tổng hợp. Chức danh chưa có trong hệ thống sẽ được tự thêm.'],
      ['4. Mã nhân viên đã tồn tại sẽ được cập nhật họ tên, chức danh, khoa/phòng.'],
      ['5. Có thể import trực tiếp file "Bảng công tổng hợp" của nhân sự, không cần chuyển sang file mẫu.']
    ]);
    help['!cols'] = [{ wch: 120 }];
    XLSX.utils.book_append_sheet(wb, help, 'Huong dan');
    XLSX.writeFile(wb, 'mau-import-nguoi-dung.xlsx');
  } else {
    const csv = '\uFEFF' + [head].concat(sample).map(r => r.map(c => '"' + c.replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'mau-import-nguoi-dung.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
}

    const list = selUsers(); if (!list.length) return;
    if (SERVER){
      try { await call('onemsg_admin_bulk', { p_token: ui.token, p_ids: list.map(u => u.id), p_action: 'unlock' }); await loadAdmin(); } catch(e){ return; }
      ui.sel.clear(); render(); toast('Đã mở khóa ' + list.length + ' tài khoản'); return;
    }
    list.forEach(u => { u.active = true; });
    ui.sel.clear(); save(); render(); toast('Đã mở khóa ' + list.length + ' tài khoản');
  },
  async bulkDel(){
    const list = selUsers(); if (!list.length) return;
    if (!await confirmBox('Xóa <strong>' + list.length + '</strong> tài khoản đã chọn? Không thể hoàn tác.')) return;
    if (SERVER){
      try {
        const r = await call('onemsg_admin_delete_users', { p_token: ui.token, p_ids: list.map(u => u.id) });
        if (!r.ok) return toast(r.error);
        await loadAdmin();
      } catch(e){ return; }
      ui.sel.clear(); render(); toast('Đã xóa ' + list.length + ' tài khoản'); return;
    }
    const ids = new Set(list.map(u => u.id));
    db.users = db.users.filter(u => !ids.has(u.id));
    ui.sel.clear(); save(); render(); toast('Đã xóa ' + list.length + ' tài khoản');
  },

  async saveSettings(){
    const name = document.getElementById('setName').value.trim();
    const tag = document.getElementById('setTag').value.trim();
    const pw = document.getElementById('setPw').value.trim();
    if (!name) return toast('Vui lòng nhập tên hệ thống.');
    if (pw.length < 6) return toast('Mật khẩu mặc định tối thiểu 6 ký tự.');
    if (SERVER){
      try {
        const r = await call('onemsg_admin_save_settings', { p_token: ui.token, p_settings: { appName: name, tagline: tag, defaultPassword: pw } });
        if (!r.ok) return toast(r.error);
        await loadAdmin();
      } catch(e){ return; }
      render(); toast('Đã lưu cài đặt'); return;
    }
    db.settings.appName = name; db.settings.tagline = tag; db.settings.defaultPassword = pw;
    save(); render(); toast('Đã lưu cài đặt');
  },
  exportData(){
    const data = JSON.parse(JSON.stringify(db));
    if (SERVER && data.settings) delete data.settings.defaultPassword;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date(), p = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = 'one-msg-dktk-backup-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  },
  importData(){ document.getElementById('importFile').click(); },
  async resetData(){
    if (!await confirmBox('Đưa toàn bộ chức năng, chức danh và người dùng về <strong>dữ liệu mẫu</strong>? Dữ liệu hiện tại sẽ mất (hãy tải bản sao lưu trước).', 'Đưa về dữ liệu mẫu')) return;
    db = seed(); save(); ui.sel.clear(); logout(); toast('Đã đưa về dữ liệu mẫu');
  }
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !actions[el.dataset.act]) return;
  actions[el.dataset.act](el, e);
});
app.addEventListener('input', e => {
  if (e.target.id === 'q'){ ui.q = e.target.value; renderResults(); }
  else if (e.target.id === 'uq'){ ui.uq = e.target.value; ui.upage = 1; renderUserList(); }
  else if (e.target.id === 'matq'){ ui.matq = e.target.value; applyMatFilter(); }
});
app.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'loginForm'){
    e.preventDefault();
    const code = f.username.value, pw = f.password.value;
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
    const err = await doLogin(code, pw);
    if (err) renderLogin(err, code); else render();
  } else if (f.id === 'pwForm'){
    e.preventDefault();
    if (SERVER){
      const n1 = f.np.value, n2 = f.np2.value;
      if (n1.length < 6){ renderChangePw('Mật khẩu mới tối thiểu 6 ký tự.'); return; }
      if (n1 !== n2){ renderChangePw('Hai lần nhập mật khẩu chưa giống nhau.'); return; }
      try {
        const r = await rpc('onemsg_change_password', { p_token: ui.token, p_new: n1, p_current: null });
        if (!r.ok){ renderChangePw(r.error); return; }
        await loadMe();
      } catch(er){
        renderChangePw(er.message === 'NETWORK' ? 'Không kết nối được máy chủ.' : er.message === 'SESSION' ? 'Phiên đã hết hạn, hãy quay lại đăng nhập.' : 'Lỗi máy chủ: ' + er.message);
        return;
      }
      ui.pendingId = null; ui.page = 'portal'; ui.q = ''; ui.cat = 'all'; ui.viewAs = null;
      render(); toast('Đã đổi mật khẩu');
      return;
    }
    const u = db.users.find(x => x.id === ui.pendingId);
    if (!u){ ui.pendingId = null; render(); return; }
    const err = checkNewPw(f.np.value, f.np2.value, u);
    if (err){ renderChangePw(err); return; }
    u.pass = hashPw(f.np.value); u.mustChange = false;
    save(); finishLogin(u); render(); toast('Đã đổi mật khẩu');
  }
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'ut'){ ui.ut = el.value; ui.upage = 1; renderUserList(); return; }
  if (el.id === 'ud'){ ui.ud = el.value; ui.upage = 1; renderUserList(); return; }
  if (el.id === 'selAll'){
    const rows = [...document.querySelectorAll('[data-sel]')];
    rows.forEach(c => { if (el.checked) ui.sel.add(c.dataset.sel); else ui.sel.delete(c.dataset.sel); });
    renderUserList(); return;
  }
  if (el.dataset && el.dataset.sel){
    if (el.checked) ui.sel.add(el.dataset.sel); else ui.sel.delete(el.dataset.sel);
    renderUserList(); return;
  }
  if (el.hasAttribute && el.hasAttribute('data-mat')){
    const t = db.tools.find(x => x.id === el.dataset.t);
    if (!t) return;
    if (SERVER){
      const on = el.checked;
      try { await call('onemsg_admin_set_tool_title', { p_token: ui.token, p_tool: el.dataset.t, p_title: el.dataset.c, p_on: on }); }
      catch(er){ el.checked = !on; return; }
      t.titleIds = (t.titleIds || []).filter(x => x !== el.dataset.c);
      if (on) t.titleIds.push(el.dataset.c);
      toast('Đã lưu');
      return;
    }
    t.titleIds = (t.titleIds || []).filter(x => x !== el.dataset.c);
    if (el.checked) t.titleIds.push(el.dataset.c);
    save(); toast('Đã lưu');
    return;
  }
  if (el.id === 'importFile' && el.files.length){
    const file = el.files[0];
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || !Array.isArray(d.tools) || !Array.isArray(d.users) || !d.settings) throw new Error('format');
        if (!Array.isArray(d.titles)) throw new Error('old');
        if (!d.users.some(u => u.role === 'admin' && u.active)) throw new Error('admin');
        if (!await confirmBox('Khôi phục dữ liệu từ file <strong>' + esc(file.name) + '</strong>? Dữ liệu hiện tại sẽ bị thay thế.', 'Khôi phục')) return;
        db = d; if (!db.settings.defaultPassword) db.settings.defaultPassword = DEFAULT_PASSWORD;
        ui.sel.clear(); save(); render(); toast('Đã khôi phục dữ liệu');
      } catch(err){
        toast(err.message === 'admin' ? 'File thiếu tài khoản quản trị viên đang hoạt động.'
          : err.message === 'old' ? 'File sao lưu của phiên bản cũ (chưa có chức danh), không khôi phục được.'
          : 'File không đúng định dạng sao lưu của hệ thống.');
      }
    };
    rd.readAsText(file);
    el.value = '';
  }
});

async function boot(){
  if (SERVER){
    app.innerHTML = '<div class="empty" style="margin:20vh auto;max-width:360px"><strong>Đang tải...</strong></div>';
    try { const p = await rpc('onemsg_public', {}); db.settings.appName = p.appName; db.settings.tagline = p.tagline; } catch(e){}
    if (ui.token){
      try { await loadMe(); }
      catch(e){
        if (e.message === 'MUST_CHANGE'){ ui.pendingId = 'server'; ui.pendingName = ''; }
        else { ui.token = null; lsDel(TOKEN_KEY); }
      }
    }
  }
  render();
}
// Quay lại tab trình duyệt thì cập nhật lại danh sách chức năng được xem
document.addEventListener('visibilitychange', async () => {
  if (!SERVER || document.hidden || !ui.me || ui.page !== 'portal' || ui.viewAs || document.querySelector('dialog[open]')) return;
  if (await refreshMe()) renderPortal();
});
boot();
})();

</script>
